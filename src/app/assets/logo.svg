<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <pattern id="gridPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="white" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="48" height="48" rx="8" fill="url(#faviconGrad)"/>
  
  <!-- Grid overlay -->
  <rect width="48" height="48" rx="8" fill="url(#gridPattern)"/>
  
  <!-- JL text -->
  <text x="24" y="32" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">JL</text>
  
  <!-- Pulse indicator -->
  <circle cx="42" cy="6" r="3" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
